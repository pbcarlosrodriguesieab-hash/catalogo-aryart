<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ary Art - Painel Administrativo Real</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #1a1e21; }
        header { background-color: #1a1e21; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid #0056b3; }
        header h1 { margin: 0; font-size: 20px; color: #0056b3; }
        header h1 span { color: white; }
        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; margin-left: 15px; }
        nav a:hover { color: #ff7300; }
        .admin-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { color: #0056b3; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 18px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #ff7300; }
        .btn-danger { background-color: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; margin: 0; border: none; color: white; border-radius: 4px; cursor: pointer; }
        .btn-danger:hover { background-color: #bd2130; }
        .alerta { background-color: #d4edda; color: #155724; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold; display: none; }
        .item-lista { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .item-lista:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <script>
        let uValido = "aryart", sValido = "art123";
        let uDig = prompt("Digite o Usuário de Administrador:"), sDig = prompt("Digite a Senha de Administrador:");
        if (uDig !== uValido || sDig !== sValido) { alert("Acesso Negado!"); window.location.href = "index.html"; }
    </script>
    <header>
        <h1>Ary<span>Art</span> | Painel Admin Real</h1>
        <nav><a href="index.html" target="_blank">👁️ Ver Site</a></nav>
    </header>
    <div class="admin-container">
        <div id="mensagem-salvo" class="alerta">✅ Operação realizada com sucesso!</div>
        
        <!-- Bloco Ocultado temporariamente caso seu server.js não use a rota de config global -->
        <div class="box" style="display: none;">
            <h2>⚙️ Configurações Gerais (Banco de Dados)</h2>
            <form id="form-admin">
                <div class="form-group"><label for="admin-whatsapp">WhatsApp de Atendimento:</label><input type="text" id="admin-whatsapp" placeholder="Ex: 5511999999999"></div>
                <div class="form-group"><label for="admin-titulo-home">Título Principal:</label><input type="text" id="admin-titulo-home"></div>
                <div class="form-group"><label for="admin-subtitulo-home">Texto/Subtítulo:</label><textarea id="admin-subtitulo-home" rows="3"></textarea></div>
                <button type="submit">Salvar Alterações</button>
            </form>
        </div>

        <div class="box">
            <h2>🗂️ Criar Novas Abas e Subpáginas</h2>
            <form id="form-abas">
                <div style="display: flex; gap: 10px;"><input type="text" id="nome-aba" placeholder="Ex: Canecas" required><button type="submit" style="width: auto; margin: 0; white-space: nowrap;">+ Criar Aba</button></div>
            </form>
            <h3 style="font-size: 14px; margin-top: 20px;">Abas Ativas no Menu:</h3>
            <div id="lista-abas"></div>
        </div>

        <div class="box">
            <h2>🎁 Adicionar Produtos nas Abas</h2>
            <form id="form-produtos">
                <div class="form-group"><label for="prod-nome">Nome do Produto:</label><input type="text" id="prod-nome" required></div>
                <div class="form-group"><label for="prod-aba">Escolha a Aba:</label><select id="prod-aba" required><option value="">-- Carregando categorias... --</option></select></div>
                <div class="form-group"><label for="prod-preco">Preço (R$):</label><input type="text" id="prod-preco" required></div>
                <div class="form-group"><label for="prod-img">Links das Fotos (Separadas por VÍRGULA):</label><textarea id="prod-img" rows="3" placeholder="Ex: images/foto1.jpg, images/foto2.jpg"></textarea></div>
                <button type="submit">Cadastrar Produto</button>
            </form>
            <h3 style="font-size: 14px; margin-top: 20px;">Produtos Cadastrados no SQLite:</h3>
            <div id="lista-produtos"></div>
        </div>
    </div>

    <script>
        window.onload = async function() { 
            await cAbas(); 
            await cProds(); 
        }

        function mostrarAviso() {
            let aviso = document.getElementById('mensagem-salvo');
            aviso.style.display = 'block';
            setTimeout(() => { aviso.style.display = 'none'; }, 3000);
        }

        // --- SISTEMA DE CATEGORIAS / ABAS ---
        document.getElementById('form-abas').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            let input = document.getElementById('nome-aba'), nomeAba = input.value.trim();
            if(nomeAba) {
                await fetch('/api/categorias', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: nomeAba }) });
                input.value = ""; 
                await cAbas(); 
                mostrarAviso();
            }
        });

        async function cAbas() {
            let r = await fetch('/api/categorias'), abas = await r.json();
            let lista = document.getElementById('lista-abas'), seletor = document.getElementById('prod-aba');
            lista.innerHTML = ""; 
            seletor.innerHTML = '<option value="">-- Selecione uma aba --</option>';
            
            if(abas) {
                abas.forEach(a => {
                    let d = document.createElement('div'); 
                    d.className = "item-lista"; 
                    d.innerHTML = `<span>📂 <b>${a.nome}</b></span>`; 
                    lista.appendChild(d);
                    
                    let o = document.createElement('option'); 
                    o.value = a.id; 
                    o.textContent = a.nome; 
                    seletor.appendChild(o);
                });
            }
        }

        // --- SISTEMA DE PRODUTOS ---
        document.getElementById('form-produtos').addEventListener('submit', async function(e) {
            e.preventDefault();
            let listaImagens = document.getElementById('prod-img').value.split(',').map(img => img.trim()).filter(img => img !== "");
            if(listaImagens.length === 0) listaImagens.push('images/logo.png');

            let p = { 
                nome: document.getElementById('prod-nome').value, 
                categoria_id: document.getElementById('prod-aba').value, 
                preco: parseFloat(document.getElementById('prod-preco').value.replace(',', '.')), 
                imagens: listaImagens,
                descricao: ""
            };

            await fetch('/api/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(p)
            });

            document.getElementById('form-produtos').reset();
            await cProds(); 
            mostrarAviso();
        });

        async function cProds() {
            let r = await fetch('/api/produtos'), prods = await r.json();
            let lista = document.getElementById('lista-produtos');
            lista.innerHTML = "";
            if(prods) {
                prods.forEach(p => {
                    let d = document.createElement('div');
                    d.className = "item-lista";
                    d.innerHTML = `<span>🎁 <b>${p.nome}</b> - R$ ${p.preco.toFixed(2)}</span>`;
                    lista.appendChild(d);
                });
            }
        }
    </script>
</body>
</html>
