<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ary Art - Painel Administrativo Real</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #1a1e21; }
        header { background-color: #1a1e21; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid #0056b3; }
        header h1 { margin: 0; font-size: 20px; color: #0056b3; }
        header h1 span { color: white; }
        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; margin-left: 15px; }
        .admin-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { color: #0056b3; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 18px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background-color: #ff7300; }
        .btn-danger { background-color: #dc3545; width: auto; padding: 6px 12px; font-size: 13px; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-danger:hover { background-color: #b02a37; }
        .btn-ver { background-color: #17a2b8; width: auto; padding: 6px 12px; font-size: 13px; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-ver:hover { background-color: #117888; }
        .alerta { background-color: #d4edda; color: #155724; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold; display: none; }
        .item-lista { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; gap: 10px; }
        #preview-imagens { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        #preview-imagens img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 2px solid #ddd; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 2000; justify-content: center; align-items: center; }
        .modal-overlay.aberto { display: flex; }
        .modal-box { background: white; border-radius: 12px; padding: 25px; max-width: 620px; width: 92%; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-fechar { position: absolute; top: 10px; right: 15px; font-size: 26px; color: #999; cursor: pointer; font-weight: bold; }
        .modal-fechar:hover { color: #dc3545; }
        #modal-nome { color: #0056b3; margin: 0 0 5px 0; }
        #modal-info { color: #666; font-size: 14px; margin: 0 0 15px 0; }
        #modal-fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
        #modal-fotos img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
        .modal-acoes { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-acoes .btn-danger { padding: 8px 16px; font-size: 14px; }
        .btn-neutro { background-color: #6c757d; width: auto; padding: 8px 16px; font-size: 14px; }
        .btn-neutro:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <script>
        let uValido = "aryart", sValido = "art123";
        let uDig = prompt("Digite o Usuário de Administrador:"), sDig = prompt("Digite a Senha de Administrador:");
        if (uDig !== uValido || sDig !== sValido) { alert("Acesso Negado!"); window.location.href = "index.html"; }
    </script>
    <header>
        <h1>Ary<span>Art</span> | Painel Admin</h1>
        <nav><a href="index.html" target="_blank">👁️ Ver Site</a></nav>
    </header>
    <div class="admin-container">
        <div id="mensagem-salvo" class="alerta">✅ Operação realizada com sucesso!</div>

        <div class="box">
            <h2>🎁 Adicionar Produtos nas Abas</h2>
            <form id="form-produtos">
                <div class="form-group"><label for="prod-nome">Nome do Produto:</label><input type="text" id="prod-nome" required></div>
                
                <div class="form-group">
                    <label for="prod-aba">Escolha a Aba Principal:</label>
                    <select id="prod-aba" required>
                        <option value="Bags">Bags</option>
                        <option value="Chinelos">Chinelos</option>
                        <option value="Lembrancinhas">Lembrancinhas</option>
                        <option value="Azulejos">Azulejos</option>
                        <option value="Canecas">Canecas</option>
                        <option value="Camisetas">Camisetas</option>
                        <option value="Almofadas">Almofadas</option>
                        <option value="Chaveiros">Chaveiros</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="prod-submenu">Escolha a Subcategoria:</label>
                    <select id="prod-submenu" required>
                        <option value="Times">Times</option>
                        <option value="Datas Comemorativas">Datas Comemorativas</option>
                        <option value="Profissões">Profissões</option>
                        <option value="Diversas">Diversas</option>
                        <option value="Novidades">Novidades</option>
                    </select>
                </div>
                
                <div class="form-group"><label for="prod-preco">Preço (R$):</label><input type="text" id="prod-preco" placeholder="Ex: 35.00" required></div>

                <div class="form-group"><label for="prod-link">💳 Link de Pagamento do Mercado Livre (opcional):</label><input type="text" id="prod-link" placeholder="Ex: https://mpago.la/XXXX"></div>
                
                <div class="form-group">
                    <label for="prod-img">📸 Selecionar Foto(s) do Computador:</label>
                    <input type="file" id="prod-img" accept="image/*" multiple required>
                    <div id="preview-imagens"></div>
                </div>
                
                <button type="submit">Cadastrar Produto</button>
            </form>
            <h3 style="font-size: 14px; margin-top: 20px;">Produtos Cadastrados no SQLite:</h3>
            <div id="lista-produtos"></div>
        </div>
    </div>

    <div id="modal-produto" class="modal-overlay">
        <div class="modal-box">
            <span class="modal-fechar" onclick="fecharModal()">&times;</span>
            <h2 id="modal-nome"></h2>
            <p id="modal-info"></p>
            <div id="modal-fotos"></div>
            <div class="modal-acoes">
                <button class="btn-neutro" onclick="fecharModal()">Fechar</button>
                <button class="btn-danger" id="btn-excluir-modal">❌ Excluir Produto</button>
            </div>
        </div>
    </div>

    <script>
        let imagensBase64 = [];
        let listaProdutos = [];

        // Comprime a foto antes de enviar (fica leve e carrega rápido no celular)
        function comprimirImagem(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 900;
                    let w = img.width, h = img.height;
                    if (w > MAX || h > MAX) {
                        const fator = Math.min(MAX / w, MAX / h);
                        w = Math.round(w * fator);
                        h = Math.round(h * fator);
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('prod-img').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            imagensBase64 = [];
            const preview = document.getElementById('preview-imagens');
            preview.innerHTML = '<p style="font-size:12px; color:#666;">Processando fotos...</p>';

            let processadas = 0;
            files.forEach(file => {
                comprimirImagem(file, function(base64) {
                    imagensBase64.push(base64);
                    processadas++;
                    if (processadas === files.length) {
                        preview.innerHTML = '';
                        imagensBase64.forEach(src => {
                            const img = document.createElement('img');
                            img.src = src;
                            preview.appendChild(img);
                        });
                    }
                });
            });
        });

        window.onload = function() { cProds(); }

        function mostrarAviso() {
            let aviso = document.getElementById('mensagem-salvo'); aviso.style.display = 'block';
            setTimeout(() => { aviso.style.display = 'none'; }, 3000);
        }

        document.getElementById('form-produtos').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if(imagensBase64.length === 0) {
                alert("Por favor, selecione pelo menos uma foto.");
                return;
            }

            let p = { 
                nome: document.getElementById('prod-nome').value, 
                categoria_id: document.getElementById('prod-aba').value, 
                subcategoria_id: document.getElementById('prod-submenu').value, 
                preco: parseFloat(document.getElementById('prod-preco').value.replace(',', '.')), 
                link_pagamento: document.getElementById('prod-link').value.trim(),
                imagens: JSON.stringify(imagensBase64) 
            };

            await fetch('/api/produtos', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(p) 
            });
            
            document.getElementById('form-produtos').reset(); 
            document.getElementById('preview-imagens').innerHTML = '';
            imagensBase64 = [];
            await cProds(); 
            mostrarAviso();
        });

        async function cProds() {
            let r = await fetch('/api/produtos'), prods = await r.json();
            listaProdutos = prods || [];
            let lista = document.getElementById('lista-produtos'); lista.innerHTML = "";
            listaProdutos.forEach(p => {
                let d = document.createElement('div'); d.className = "item-lista";
                d.innerHTML = '<span>🎁 <b>' + p.nome + '</b> - R$ ' + parseFloat(p.preco).toFixed(2) + ' (' + p.categoria_id + ' > ' + p.subcategoria_id + ')' + (p.link_pagamento ? ' 💳' : '') + '</span>' +
                '<span style="white-space: nowrap;">' +
                    '<button class="btn-ver" onclick="verProduto(' + p.id + ')">👁️ Ver</button> ' +
                    '<button class="btn-danger" onclick="excluirProduto(' + p.id + ')">❌ Excluir</button>' +
                '</span>';
                lista.appendChild(d);
            });
        }

        function verProduto(id) {
            const p = listaProdutos.find(prod => prod.id === id);
            if(!p) return;

            document.getElementById('modal-nome').textContent = "🎁 " + p.nome;
            document.getElementById('modal-info').textContent = 'R$ ' + parseFloat(p.preco).toFixed(2) + '  •  ' + p.categoria_id + ' > ' + p.subcategoria_id + (p.link_pagamento ? '  •  💳 Possui link de pagamento' : '');
            
            let imagens = [];
            try { imagens = JSON.parse(p.imagens); } catch(e) { if(p.imagens) imagens = [p.imagens]; }
            
            const fotosDiv = document.getElementById('modal-fotos');
            fotosDiv.innerHTML = '';
            if(imagens.length === 0) {
                fotosDiv.innerHTML = '<p style="color:#666; grid-column: 1/-1;">Este produto não tem fotos cadastradas.</p>';
            } else {
                imagens.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    fotosDiv.appendChild(img);
                });
            }
            
            document.getElementById('btn-excluir-modal').onclick = function() { excluirProduto(p.id); };
            document.getElementById('modal-produto').classList.add('aberto');
        }

        function fecharModal() {
            document.getElementById('modal-produto').classList.remove('aberto');
        }

        async function excluirProduto(id) {
            if(confirm("Deseja apagar este produto?")) {
                await fetch('/api/produtos/' + id, { method: 'DELETE' });
                fecharModal();
                await cProds();
                mostrarAviso();
            }
        }
    </script>
</body>
</html>
