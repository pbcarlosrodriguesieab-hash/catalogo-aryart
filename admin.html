<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ary Art - Painel Administrativo Real</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #1a1e21; }
        header { background-color: #1a1e21; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid #0056b3; }
        header h1 { margin: 0; font-size: 20px; color: #0056b3; }
        header h1 span { color: white; }
        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; margin-left: 15px; }
        .admin-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { color: #0056b3; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 18px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background-color: #ff7300; }
        .btn-danger { background-color: #dc3545; width: auto; padding: 6px 12px; font-size: 13px; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .alerta { background-color: #d4edda; color: #155724; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold; display: none; }
        .item-lista { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
    </style>
</head>
<body>
    <script>
        let uValido = "aryart", sValido = "art123";
        let uDig = prompt("Digite o Usuário de Administrador:"), sDig = prompt("Digite a Senha de Administrador:");
        if (uDig !== uValido || sDig !== sValido) { alert("Acesso Negado!"); window.location.href = "index.html"; }
    </script>
    <header>
        <h1>Ary<span>Art</span> | Painel Admin</h1>
        <nav><a href="index.html" target="_blank">👁️ Ver Site</a></nav>
    </header>
    <div class="admin-container">
        <div id="mensagem-salvo" class="alerta">✅ Operação realizada com sucesso!</div>

        <div class="box">
            <h2>🎁 Adicionar Produtos nas Abas</h2>
            <form id="form-produtos">
                <div class="form-group"><label for="prod-nome">Nome do Produto:</label><input type="text" id="prod-nome" required></div>
                
                <div class="form-group">
                    <label for="prod-aba">Escolha a Aba Principal:</label>
                    <select id="prod-aba" required>
                        <option value="Bags">Bags</option>
                        <option value="Chinelos">Chinelos</option>
                        <option value="Lembrancinhas">Lembrancinhas</option>
                        <option value="Azulejos">Azulejos</option>
                        <option value="Canecas">Canecas</option>
                        <option value="Camisetas">Camisetas</option>
                        <option value="Almofadas">Almofadas</option>
                        <option value="Chaveiros">Chaveiros</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="prod-submenu">Escolha a Subcategoria:</label>
                    <select id="prod-submenu" required>
                        <option value="Times">Times</option>
                        <option value="Datas Comemorativas">Datas Comemorativas</option>
                        <option value="Profissões">Profissões</option>
                        <option value="Diversas">Diversas</option>
                        <option value="Novidades">Novidades</option>
                    </select>
                </div>
                
                <div class="form-group"><label for="prod-preco">Preço (R$):</label><input type="text" id="prod-preco" placeholder="Ex: 35.00" required></div>
                <div class="form-group"><label for="prod-img">Links das Fotos (Separadas por VÍRGULA):</label><textarea id="prod-img" rows="3" placeholder="Ex: https://linkdafoto.com" required></textarea></div>
                <button type="submit">Cadastrar Produto</button>
            </form>
            <h3 style="font-size: 14px; margin-top: 20px;">Produtos Cadastrados no SQLite:</h3>
            <div id="lista-produtos"></div>
        </div>
    </div>

    <script>
        window.onload = function() { cProds(); }

        function mostrarAviso() {
            let aviso = document.getElementById('mensagem-salvo'); aviso.style.display = 'block';
            setTimeout(() => { aviso.style.display = 'none'; }, 3000);
        }

        document.getElementById('form-produtos').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let p = { 
                nome: document.getElementById('prod-nome').value, 
                categoria_id: document.getElementById('prod-aba').value, 
                subcategoria_id: document.getElementById('prod-submenu').value, 
                preco: parseFloat(document.getElementById('prod-preco').value.replace(',', '.')), 
                imagens: document.getElementById('prod-img').value
            };

            await fetch('/api/produtos', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(p) 
            });
            
            document.getElementById('form-produtos').reset(); 
            cProds(); 
            mostrarAviso();
        });

        async function cProds() {
            let r = await fetch('/api/produtos'), prods = await r.json();
            let lista = document.getElementById('lista-produtos'); lista.innerHTML = "";
            if(prods) {
                prods.forEach(p => {
                    let d = document.createElement('div'); d.className = "item-lista";
                    d.innerHTML = `<span>🎁 <b>${p.nome}</b> - R$ ${parseFloat(p.preco).toFixed(2)} (${p.categoria_id} > ${p.subcategoria_id})</span><button class="btn-danger" onclick="excluirProduto(${p.id})">❌ Excluir</button>`;
                    lista.appendChild(d);
                });
            }
        }

        async function excluirProduto(id) {
            if(confirm("Deseja apagar este produto?")) {
                await fetch(`/api/produtos/${id}`, { method: 'DELETE' }); cProds(); mostrarAviso();
            }
        }
    </script>
</body>
</html>
