<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ary Art - Finalizar Pedido</title>
<style>
  body { font-family:'Segoe UI',sans-serif; margin:0; background:#f4f6f9; color:#1a1e21; }
  header { background:#1a1e21; color:#fff; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:4px solid #0056b3; }
  header h1 { margin:0; font-size:20px; color:#0056b3; } header h1 span{color:#fff;}
  header a { color:#fff; text-decoration:none; font-weight:bold; font-size:14px; }
  .container { max-width:700px; margin:30px auto; padding:0 20px; }
  .box { background:#fff; border-radius:12px; padding:25px; margin-bottom:20px; box-shadow:0 4px 15px rgba(0,0,0,.05); }
  h2 { color:#0056b3; font-size:18px; margin-top:0; }
  .item-carrinho { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px; border-bottom:1px solid #eee; flex-wrap:wrap; }
  .btn-arquivo { background:#17a2b8; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; }
  .btn-remover { background:#dc3545; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; }
  label { display:block; font-weight:bold; margin:12px 0 5px; }
  input, textarea { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
  .total { font-size:20px; font-weight:bold; color:#ff7300; text-align:right; margin:15px 0; }
  button.finalizar { width:100%; background:#0056b3; color:#fff; border:none; padding:14px; font-size:16px; font-weight:bold; border-radius:6px; cursor:pointer; }
  button.finalizar:hover { background:#ff7300; }
  .arquivo-info { font-size:12px; color:#155724; width:100%; }
  .sucesso { display:none; background:#d4edda; color:#155724; padding:20px; border-radius:12px; text-align:center; font-weight:bold; margin-bottom:20px; }
  .link-pagar { display:block; background:#3483fa; color:#fff; text-decoration:none; padding:10px; border-radius:6px; margin-top:8px; font-weight:bold; text-align:center; }
  .link-whats { display:block; background:#25d366; color:#fff; text-decoration:none; padding:12px; border-radius:6px; margin-top:12px; font-weight:bold; text-align:center; font-size:16px; }
</style>
</head>
<body>
<header><h1>Ary<span>Art</span> | Finalizar Pedido</h1><a href="index.html">← Voltar ao Catálogo</a></header>
<div class="container">
  <div id="sucesso" class="sucesso"></div>
  <div id="conteudo">
    <div class="box">
      <h2>🛒 Seu Carrinho</h2>
      <div id="lista-itens"></div>
      <div class="total" id="total"></div>
    </div>
    <div class="box">
      <h2>📋 Seus Dados</h2>
      <label>Nome completo:</label><input type="text" id="cli-nome">
      <label>WhatsApp para contato:</label><input type="text" id="cli-contato" placeholder="(00) 00000-0000">
      <label>Observações / endereço (opcional):</label><textarea id="cli-obs" rows="3"></textarea>
    </div>
    <button class="finalizar" onclick="finalizarPedido()">✅ Finalizar Pedido</button>
  </div>
</div>
<script>
const WHATS_LOJA = '5511977534671';
let carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
let arquivos = {};

function renderizar() {
  const lista = document.getElementById('lista-itens');
  lista.innerHTML = '';
  if (carrinho.length === 0) {
    lista.innerHTML = '<p style="color:#666;">Seu carrinho está vazio. <a href="index.html">Ver catálogo</a></p>';
    document.getElementById('total').textContent = '';
    return;
  }
  carrinho.forEach(item => {
    const d = document.createElement('div');
    d.className = 'item-carrinho';
    d.innerHTML = '<span><b>' + item.qtd + 'x</b> ' + item.nome + ' — R$ ' + (parseFloat(item.preco) * item.qtd).toFixed(2) + '</span>' +
      '<span style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">' +
        '<button class="btn-arquivo" onclick="document.getElementById(\'file-' + item.id + '\').click()">📎 Enviar arquivo</button>' +
        '<input type="file" id="file-' + item.id + '" accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf" style="display:none" onchange="anexarArquivo(' + item.id + ', this)">' +
        '<button class="btn-remover" onclick="removerItem(' + item.id + ')">❌</button>' +
      '</span>' +
      '<span class="arquivo-info" id="info-' + item.id + '"></span>';
    lista.appendChild(d);
  });
  const total = carrinho.reduce((s, i) => s + parseFloat(i.preco) * i.qtd, 0);
  document.getElementById('total').textContent = 'Total: R$ ' + total.toFixed(2);
}

function anexarArquivo(id, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('Arquivo muito grande! O tamanho máximo é 2MB.'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    arquivos[id] = { nome: file.name, base64: e.target.result };
    document.getElementById('info-' + id).textContent = '✅ Arquivo anexado: ' + file.name;
  };
  reader.readAsDataURL(file);
}

function removerItem(id) {
  carrinho = carrinho.filter(i => i.id !== id);
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  renderizar();
}

async function finalizarPedido() {
  if (carrinho.length === 0) { alert('Seu carrinho está vazio!'); return; }
  const nome = document.getElementById('cli-nome').value.trim();
  const contato = document.getElementById('cli-contato').value.trim();
  if (!nome || !contato) { alert('Por favor, preencha seu nome e WhatsApp.'); return; }

  const itens = carrinho.map(i => ({
    id: i.id, nome: i.nome, preco: i.preco, qtd: i.qtd,
    link_pagamento: i.link_pagamento || '',
    arquivo: arquivos[i.id] || null
  }));
  const total = carrinho.reduce((s, i) => s + parseFloat(i.preco) * i.qtd, 0);

  const r = await fetch('/api/pedidos', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cliente: nome, contato: contato, observacoes: document.getElementById('cli-obs').value.trim(), itens: itens, total: total })
  });
  if (!r.ok) { alert('Erro ao enviar o pedido. Tente novamente.'); return; }

  // Monta a mensagem do WhatsApp com o resumo do pedido
  let msg = 'Olá! Acabei de fazer um pedido no catálogo Ary Art.\n\n';
  msg += 'Cliente: ' + nome + '\n';
  msg += 'Contato: ' + contato + '\n\n';
  itens.forEach(i => {
    msg += '• ' + i.qtd + 'x ' + i.nome + ' - R$ ' + (parseFloat(i.preco) * i.qtd).toFixed(2);
    if (i.arquivo) msg += ' (enviou arquivo — baixar no painel admin)';
    msg += '\n';
  });
  msg += '\nTotal: R$ ' + total.toFixed(2);
  const obs = document.getElementById('cli-obs').value.trim();
  if (obs) msg += '\nObs: ' + obs;

  localStorage.removeItem('carrinho');
  carrinho = [];

  let html = '✅ Pedido enviado com sucesso!<br>Clique abaixo para confirmar pelo WhatsApp:';
  html += '<a class="link-whats" href="https://wa.me/' + WHATS_LOJA + '?text=' + encodeURIComponent(msg) + '" target="_blank">💬 Confirmar pelo WhatsApp</a>';
  const comLink = itens.filter(i => i.link_pagamento);
  if (comLink.length) {
    html += '<br><b>Pagamento pelo Mercado Livre:</b>';
    comLink.forEach(i => { html += '<a class="link-pagar" href="' + i.link_pagamento + '" target="_blank">💳 Pagar: ' + i.nome + '</a>'; });
  }
  document.getElementById('conteudo').style.display = 'none';
  const s = document.getElementById('sucesso');
  s.innerHTML = html;
  s.style.display = 'block';
}

renderizar();
</script>
</body>
</html>
